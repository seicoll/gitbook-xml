site_name: Llenguatge de marques
site_url: https://seicoll.github.io/gitbook-xml/
repo_url: https://github.com/seicoll/gitbook-xml

theme:
  name: material
  logo: assets/js_icon.png
  favicon: assets/js_icon.png

  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - scheme: default
      primary: white
      accent: blue
  font:
    text: Inter
    code: JetBrains Mono

plugins:
  - search

copyright: |
  © 2026 Sergi Coll  
   – Institut Bosc de la Coma

markdown_extensions:
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences

extra_css:
  - stylesheets/extra.css

nav:
  - UNITAT 1. HTML I CSS:
      - Llenguatge HTML: 01-html-css/uf1_html.md
      - CSS: 01-html-css/uf1_css.md
      - Disseny responsiu: 01-html-css/responsive.md

  - UNITAT 2. Llenguatges de marques:
      - Introducció: unitat-2.-xml-i-json/intro.md
      - Markdown: unitat-2.-xml-i-json/markdown.md
      - XML: unitat-2.-xml-i-json/xml.md
      - JSON: unitat-2.-xml-i-json/json.md
      - Validació amb DTD: unitat-2.-xml-i-json/uf1_dtd.md
      - Validació amb XSD: unitat-2.-xml-i-json/uf1_xsd.md
      - Exercicis: unitat-2.-xml-i-json/exercicis.md

  - UNITAT 3. Javascript i Sistemes de gestió empresarial:

